name: MyTodo
options:
  bundleIdPrefix: com.ponyo877
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 579Y3Y3699
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
targets:
  MyTodo:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ponyo877.MyTodo
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Todo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
schemes:
  MyTodo:
    build:
      targets:
        MyTodo: all
    run:
      config: Debug
